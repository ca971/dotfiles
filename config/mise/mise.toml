[settings]
# --- NETWORK & API ---
# Increase timeout to 60s for slow APIs (prevents timeouts during GitHub congestion)
fetch_remote_versions_timeout = "60s"
# Cache the list of available versions for 1 hour to reduce API calls and avoid rate limiting
fetch_remote_versions_cache = "1h"

# --- CLEANUP & STORAGE ---
# Automatically delete the downloaded source/binary after a successful installation
always_keep_download = false
# Automatically delete the temporary installation directory if the install fails
always_keep_install = false

# --- PERFORMANCE ---
# Number of simultaneous installation jobs (4 is ideal for your M3's performance cores)
jobs = 4

[tools]
# --- LANGUAGES & RUNTIMES ---
python = "latest" # General purpose programming language
node = "latest"   # JavaScript runtime environment
go = "latest"     # Google's statically typed compiled language
ruby = "latest"   # Dynamic, open source programming language
rust = "latest"   # Systems programming language focusing on safety and speed
lua = "5.4.7"     # Fixed version to ensure LuaRocks compatibility
erlang = "latest" # Soft real-time system programming language
elixir = "latest" # Dynamic, functional language for scalable apps
deno = "latest"   # Secure runtime for JavaScript and TypeScript

# --- SHELLS ---
# "asdf:mise-plugins/mise-lua" = "latest" # A new type of shell focusing on structured data
"aqua:nushell/nushell" = "latest" # A new type of shell focusing on structured data

# --- VIRTUALIZATION & CONTAINERS ---
colima = "latest"         # Container runtime for macOS (Docker Desktop replacement)
lima = "latest"           # Linux virtual machines on macOS (required by Colima)
docker-cli = "latest"     # CLI for interacting with Docker
docker-compose = "latest" # Tool for defining and running multi-container apps
lazydocker = "latest"     # The simple terminal UI for both docker and docker-compose

# --- CORE TERMINAL TOOLS ---
neovim = "nightly"  # Hyperextensible Vim-based text editor
usage = "latest"    # CLI auto-completion engine generator
starship = "latest" # The minimal, blazing-fast, and infinitely customizable prompt
zoxide = "latest"   # A smarter cd command for your terminal
fzf = "latest"      # A command-line fuzzy finder
atuin = "latest"    # Magical shell history powered by SQLite
zellij = "latest"   # A terminal workspace with batteries included
direnv = "latest"   # Unclutter your .profile based on the current directory

# --- RUST-POWERED ALTERNATIVES ---
eza = "latest"                  # A modern, maintained replacement for ls
bat = "latest"                  # A cat clone with syntax highlighting and Git integration
fd = "latest"                   # A simple, fast and user-friendly alternative to 'find'
ripgrep = "latest"              # Line-oriented search tool that recursively searches directories
yazi = "latest"                 # Blazing fast terminal file manager written in Rust
"aqua:ouch-org/ouch" = "latest" # Painless compression and decompression for the terminal
"aqua:dalance/procs" = "latest" # A modern replacement for ps written in Rust
bottom = "latest"               # Yet another cross-platform graphical process/system monitor
dust = "latest"                 # A more intuitive version of du in Rust
"aqua:orf/gping" = "latest"     # Ping, but with a graph
"aqua:muesli/duf" = "latest"    # Disk Usage/Free Utility - a better 'df' replacement

# --- WEB, API & DATA ---
jq = "latest"    # Lightweight and flexible command-line JSON processor
yq = "latest"    # Portable command-line YAML, JSON, XML, CSV and TOML processor
xh = "latest"    # Friendly and fast tool for sending HTTP requests
hurl = "latest"  # Run and test HTTP requests with plain text
doggo = "latest" # Human-readable DNS client for dig lovers

# --- CLOUD, OPS & SEC ---
awscli = "latest"                 # Official CLI for Amazon Web Services
"aqua:aws/aws-sam-cli" = "latest" # CLI for local development and testing of Serverless apps
helm = "latest"                   # The Kubernetes Package Manager
kubectl = "latest"                # Command line tool for communicating with a Kubernetes cluster
k9s = "latest"                    # Kubernetes CLI To Manage Your Clusters In Style
doctl = "latest"                  # Command line interface for the DigitalOcean API
sops = "latest"                   # Editor of encrypted files
age = "latest"                    # A simple, modern and secure file encryption tool
terraform = "latest"              # Tool for building, changing, and versioning infrastructure

# --- FORMATTERS & LINTERS ---
biome = "latest"      # Toolchain of the web (linter, formatter, and more)
stylua = "latest"     # An opinionated Lua code formatter
taplo = "latest"      # A TOML toolkit for linting and formatting
shellcheck = "latest" # Static analysis tool for shell scripts
hadolint = "latest"   # Dockerfile linter, validate inline bash and lint Dockerfiles

# --- DEV UTILITIES ---
gh = "latest"        # GitHub’s official command line tool
lazygit = "latest"   # Simple terminal UI for git commands
just = "latest"      # Handy runner for project-specific commands
gum = "latest"       # A tool for glamorous shell scripts
tokei = "latest"     # Program that allows you to count your code, quickly
hyperfine = "latest" # A command-line benchmarking tool
